[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paperless-ollama-ocr"
version = "0.1.3"
description = "Self-hosted Ollama vision models as an OCR engine for Paperless-ngx"
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-or-later"
keywords = ["paperless-ngx", "ollama", "ocr", "document-management", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Indexing",
]

# No runtime dependencies: httpx, pikepdf, ocrmypdf, Pillow and pdf2image
# all ship with the official paperless-ngx image.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.15,<0.16"]

[project.entry-points."paperless_ngx.parsers"]
ollama_ocr = "paperless_ollama_ocr.parser:OllamaOcrParser"

[tool.hatch.build.targets.wheel]
packages = ["src/paperless_ollama_ocr"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.isort]
force-single-line = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
