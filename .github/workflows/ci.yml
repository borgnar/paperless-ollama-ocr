name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # poppler is needed because the parser tests rasterise a real PDF;
      # ghostscript/tesseract are NOT, the geometry pass is mocked out.
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install -e ".[dev]" pillow pikepdf pdf2image ocrmypdf
      - run: ruff check src tests && ruff format --check src tests
      - run: pytest -q
